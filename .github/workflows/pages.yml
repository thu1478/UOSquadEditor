name: Deploy mission editor

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tools/mission_editor/package-lock.json
      - name: Install and build
        working-directory: Tools/mission_editor
        env:
          VITE_BASE: /UOSquadEditor/
          VITE_STATIC: "1"
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Tools/mission_editor/dist
          force_orphan: true

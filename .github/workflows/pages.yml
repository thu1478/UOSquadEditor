name: Deploy Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tools/mission_editor/package-lock.json
      - name: Build hub + editor
        working-directory: Tools/mission_editor
        env:
          VITE_BASE: /UOSquadEditor/editor/
          VITE_STATIC: "1"
        run: |
          npm ci
          npm run build
          mkdir -p ../../_site/editor
          cp -a dist/. ../../_site/editor/
          cp ../site/index.html ../site/hub.css ../../_site/
          cp ../../Release/enemy_level_scale.zip ../../_site/
          touch ../../_site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
